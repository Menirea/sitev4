<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testul Menirea — 60 de întrebări</title>
<meta name="description" content="60 de întrebări despre cum ești tu când muncești. Aproximativ 10 minute.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Ccircle cx='13' cy='13' r='12' fill='%23EDF0E7'/%3E%3Ccircle cx='13' cy='13' r='10' fill='none' stroke='%2314584A' stroke-width='1.4'/%3E%3Ccircle cx='13' cy='13' r='2.6' fill='%23B8860F'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="quiz-shell">

  <div class="quiz-bar" id="bar" hidden>
    <div class="quiz-bar-inner">
      <a class="logo" href="index.html" aria-label="Înapoi la pagina principală">
        <svg width="22" height="22" viewBox="0 0 26 26" aria-hidden="true">
          <circle cx="13" cy="13" r="11.5" fill="none" stroke="#14584A" stroke-width="1.2"/>
          <circle cx="13" cy="13" r="2.2" fill="#B8860F"/>
        </svg>
      </a>
      <div class="progress"><i id="bar-fill"></i></div>
      <span class="counter" id="counter" aria-live="polite">1 / 60</span>
    </div>
  </div>

  <main class="quiz-main" id="stage"></main>

  <div class="quiz-foot" id="foot" hidden>
    <div class="quiz-foot-inner">
      <button class="btn btn-ghost btn-sm" id="back">← Înapoi</button>
      <span class="hint">1–5 aleg răspunsul · ← revii</span>
      <span></span>
    </div>
  </div>

</div>

<script src="assets/config.js"></script>
<script src="assets/data.js"></script>
<script src="assets/test.js"></script>
</body>
</html>
